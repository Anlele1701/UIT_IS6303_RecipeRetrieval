[project]
name = "recipe-search-api"
version = "0.1.0"
description = "Sparse, dense and hybrid (reranked) retrieval over recipe chunks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "lxml>=6.1.3",
    "torch>=2.4",  # listed so uv can take the CUDA build below (the reranker; MV4c)
]

[dependency-groups]
dev = ["pytest>=8", "tokenizers>=0.19", "snowballstemmer>=3.1"]  # scripts imported by their tests

[tool.uv]
package = false

# The reranker on an NVIDIA GPU (Windows/Linux): CUDA 12.8 wheels; they also run on a machine with no GPU.
# macOS keeps PyPI's build (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
markers = ["slow: needs Ollama with the pipeline models; run with -m slow"]
addopts = "-m 'not slow'"
