name: is603a3  # A3's own project and volume (is603a3_a3-pgdata); A1's is603_recipe-pgdata is never touched from here

services:
  paradedb:
    image: paradedb/paradedb@sha256:8da5d202fe31875af32a49e802ce17cfbc146b0672306f4109809efee1e6f916  # pg17, pg_search 0.25.9, same as A1
    container_name: a3-paradedb
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe
    ports:
      - "5435:5432"  # A1 uses 5434; both can run side by side
    volumes:
      - a3-pgdata:/var/lib/postgresql/data
      - ./sql/docker-init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql:/docker-entrypoint-initdb.d/sql:ro  # a folder, so the image doesn't run these itself
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe"]
      interval: 5s
      retries: 20

volumes:
  a3-pgdata:
