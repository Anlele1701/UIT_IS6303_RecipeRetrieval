services:
  paradedb:
    image: paradedb/paradedb:0.25.6-pg17
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipes"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  paradedb_data:
